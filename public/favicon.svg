<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    {/* Swiss Red Background */}
    <rect width="24" height="24" fill="#D80027" />
    
    {/* White 4-Pillar Icon (Simplified for Small Scale) */}
    <g fill="white">
        {/* Roof */}
        <rect x="2" y="4" width="20" height="3" />
        
        {/* 4 Pillars */}
        <rect x="3" y="9" width="3" height="10" />
        <rect x="8" y="9" width="3" height="10" />
        <rect x="13" y="9" width="3" height="10" />
        <rect x="18" y="9" width="3" height="10" />
        
        {/* Base */}
        <rect x="2" y="20" width="20" height="1" />
    </g>
    
    {/* The Flag Split (Cutout effect) */}
    <rect x="0" y="13" width="24" height="2" fill="#D80027" />
</svg>
